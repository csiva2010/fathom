# Non-secret settings. Secrets live in .env (see .env.example).
# Any value here can be overridden by an env var using "__" for nesting,
# e.g. AUTH__MODE=stub or MARKET__ALPACA__FEED=iex.

app:
  name: Fathom · AI Finance Assistant
  env: development            # development | test | production
  api_prefix: /api/v1
  # Local ports come from WEB_PORT / API_PORT in .env. frontend_url and cors_origins are
  # derived from WEB_PORT; set them (e.g. APP__FRONTEND_URL) only for a deployed domain.
  # frontend_url: https://finance.example.com
  # cors_origins: [https://finance.example.com]

auth:
  mode: google                # google | stub (stub is refused when app.env=production)
  session_cookie_name: fa_session
  session_ttl_hours: 12
  cookie_secure: false        # set true behind HTTPS
  # Defaults to <frontend_url>/api/v1/auth/google/callback. In dev the Vite server proxies
  # /api to the backend, so the callback and cookie land on the web app's origin.
  # google_redirect_uri: https://finance.example.com/api/v1/auth/google/callback
  google_metadata_url: https://accounts.google.com/.well-known/openid-configuration
  stub_user:
    sub: stub-user-0001
    email: dev.user@example.com
    name: Dev User

database:
  url: sqlite:///./var/app.db
  echo: false

logging:
  level: INFO
  json: true

market:
  http_timeout_seconds: 10
  # A provider call that would queue longer than this behind the per-minute limit is
  # served from cache or mock instead, so a traffic spike cannot pile up waiting requests.
  max_queue_wait_seconds: 5
  alpaca:
    data_base_url: https://data.alpaca.markets
    feed: sip                 # sip = paid real-time; iex = free tier
    requests_per_minute: 180
    # Hard cap per UTC day so the demo cannot use up the account; past it, quotes and bars
    # come from cache, then mock data, until midnight UTC. Remove for no cap.
    max_requests_per_day: 10000
    # Symbol search reads the assets list from the Trading API host (read-only, never
    # trading). Leave unset to pick paper-api or api from the key type.
    # assets_base_url: https://paper-api.alpaca.markets
  alpha_vantage:
    base_url: https://www.alphavantage.co/query
    requests_per_minute: 5    # raise to match your plan
    # max_requests_per_day: 25  # free tier; uncomment to stop calling once it is spent
  retry:
    attempts: 3
    base_delay_seconds: 0.5
    max_delay_seconds: 4.0
  circuit_breaker:
    failure_threshold: 5
    reset_seconds: 60
  cache_ttl_seconds:
    quote: 60
    bars_intraday: 3600
    bars_daily: 86400
    news: 900
    index: 900
    reference: 86400
    symbols: 86400
  # Alpha Vantage index coverage is a day-1 check; proxy_symbol is the ETF fallback.
  indices:
    - id: SPX
      name: S&P 500
      av_symbol: SPX
      proxy_symbol: SPY
    - id: IXIC
      name: Nasdaq Composite
      av_symbol: IXIC
      proxy_symbol: QQQ
    - id: DJI
      name: Dow Jones Industrial Average
      av_symbol: DJI
      proxy_symbol: DIA
  benchmark_symbol: SPY       # portfolio comparison (PF-05)
  # Sector performance is measured through the SPDR sector ETFs (MD-08).
  sector_etfs:
    - { sector: Information Technology, symbol: XLK }
    - { sector: Financials, symbol: XLF }
    - { sector: Health Care, symbol: XLV }
    - { sector: Consumer Discretionary, symbol: XLY }
    - { sector: Communication Services, symbol: XLC }
    - { sector: Industrials, symbol: XLI }
    - { sector: Consumer Staples, symbol: XLP }
    - { sector: Energy, symbol: XLE }
    - { sector: Utilities, symbol: XLU }
    - { sector: Real Estate, symbol: XLRE }
    - { sector: Materials, symbol: XLB }
  # Top movers are picked from this fixed set of liquid US stocks and ETFs.
  movers_universe: [AAPL, MSFT, NVDA, GOOGL, AMZN, META, TSLA, BRK.B, JPM, V, JNJ, PG, KO,
                    PEP, XOM, UNH, HD, WMT, DIS, NFLX, SPY, QQQ, DIA, IWM, GLD, TLT]
  warm_cache:
    on_startup: false         # true pre-warms sample tickers; costs Alpha Vantage quota

kb:
  source_dir: data/kb
  index_dir: var/index        # BM25 index + ingestion report
  vector_dir: var/chroma      # persistent ChromaDB
  chunk_tokens: 500
  chunk_overlap: 0.15
  # Each model gets its own collection (their vectors are not comparable). The first is
  # primary; at query time the next is tried if it fails, then BM25 alone answers.
  embeddings:
    # Free tier allows 100 embed requests/min; 90 leaves headroom. Raise on a paid plan.
    - { provider: gemini, model: gemini-embedding-2, collection: kb_gemini, requests_per_minute: 90 }
    - { provider: openai, model: text-embedding-3-small, collection: kb_openai }
  embed_batch_size: 64
  retrieval:
    vector_k: 20
    keyword_k: 20
    rrf_k: 60
    rerank_candidates: 20
    top_n: 5
    level_boost: 0.05         # added to the rerank score of chunks at the user's level
  reranker:
    kind: cross_encoder       # cross_encoder | lexical (lexical needs no model download)
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    cross_encoder_min_score: 0.02
    lexical_min_score: 0.5
  categories:
    - basics
    - stocks
    - bonds
    - funds_etfs
    - retirement
    - tax
    - risk_diversification
    - budgeting_saving
    - market_mechanics
    - behavioral_finance
  levels:
    - beginner
    - intermediate
    - advanced

# Chat models in fallback order (D1, NF-R02). Models whose API key is missing are skipped;
# with none configured, agents still answer from retrieved sources and service data.
llm:
  models:
    - { provider: gemini, model: gemini-flash-latest, temperature: 0.2 }
    # Same key, separate capacity: answers when Flash is overloaded (503) or times out.
    - { provider: gemini, model: gemini-flash-lite-latest, temperature: 0.2 }
    - { provider: anthropic, model: claude-sonnet-5-5, temperature: 0.2 }

workflow:
  clarify_below_confidence: 0.6   # router confidence below this asks a clarifying question
  agent_timeout_seconds: 20
  agent_retries: 1
  max_tool_rounds: 3
  max_agents_per_turn: 3
  history_messages: 8             # recent messages the router and agents see
  max_focus_tickers: 3
  max_message_chars: 4000
  max_image_bytes: 5000000        # portfolio screenshot attached to a chat message
  max_screenshot_holdings: 25
  checkpoint_path: var/checkpoints.db   # conversation memory; empty = in memory

# HTTP rate limits per client IP (scope: client) or shared by everyone (scope: global).
# Paths are regexes after the API prefix. Over a limit the API answers 429 + Retry-After.
# Sized for individual users (~30-60 calls/min at peak). For a room demo on shared Wi-Fi,
# everyone shares one IP: raise api and market first.
rate_limit:
  enabled: true
  trusted_proxies: [127.0.0.1, "::1"]   # nginx on the same host sets X-Forwarded-For
  max_tracked_clients: 10000
  rules:
    - { name: api, path: /, requests: 280, per_seconds: 60 }
    # Market routes can reach Alpaca / Alpha Vantage on a cache miss.
    - { name: market, path: /market/, requests: 200, per_seconds: 60 }
    # Each chat message runs the LLMs: per-client, plus global caps on total spend.
    - { name: chat, path: "/conversations/[^/]+/messages$", methods: [POST], requests: 20, per_seconds: 60 }
    - { name: chat_global, path: "/conversations/[^/]+/messages$", methods: [POST], requests: 120, per_seconds: 60, scope: global }
    - { name: chat_global_daily, path: "/conversations/[^/]+/messages$", methods: [POST], requests: 2000, per_seconds: 86400, scope: global }
    # Each guest sign-in creates a user row.
    - { name: guest_signin, path: /auth/guest$, methods: [POST], requests: 30, per_seconds: 600 }

seed:
  dir: data/seed
