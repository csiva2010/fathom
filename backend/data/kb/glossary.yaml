# Glossary used for hover definitions and the explain_term tool (KB-02).
# Definitions are original, plain-language summaries. `aliases` are alternate names
# (abbreviations, spellings) that resolve to the same entry.
terms:
- term: 200-day moving average
  definition: The average closing price over the past 200 trading days, a common gauge of the long-term
    trend.
  level: intermediate
  related:
  - Moving average
  - 50-day moving average
  aliases:
  - 200-day average
- term: 4% rule
  definition: A guideline that withdrawing 4% of a portfolio in year one, then adjusting for inflation,
    historically lasted about 30 years.
  level: intermediate
  related:
  - Safe withdrawal rate
  aliases:
  - four percent rule
- term: 401(k)
  definition: An employer-sponsored US retirement plan that lets employees invest part of each paycheck
    with tax advantages, often with an employer match.
  level: beginner
  related:
  - Employer match
  - IRA
  aliases:
  - 401k
  - 401 k
- term: 403(b)
  definition: A workplace retirement plan for employees of public schools, colleges and many nonprofits.
    It works much like a 401(k).
  level: beginner
  related:
  - 401(k)
  - 457(b)
- term: 457(b)
  definition: A retirement plan offered mainly by state and local governments. Governmental 457(b) withdrawals
    after leaving the employer avoid the 10% early withdrawal tax.
  level: intermediate
  related:
  - 403(b)
  - 401(k)
- term: 50-day moving average
  definition: The average closing price over the past 50 trading days, a common gauge of the short- to
    medium-term trend.
  level: intermediate
  related:
  - Moving average
  - 200-day moving average
  aliases:
  - 50-day average
- term: 50/30/20 rule
  definition: A budgeting guideline that splits after-tax income into 50% needs, 30% wants and 20% savings
