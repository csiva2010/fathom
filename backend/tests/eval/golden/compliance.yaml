# Compliance golden set (INN-02; OR-03, OR-06, NF-C01, NF-C02).
#
# drafts:   answer text as an agent might write it. `advice: true` means the compliance
#           node must catch it; `advice: false` cases guard against false positives on
#           ordinary educational wording.
# messages: user messages. `advice: true` means the router's deterministic detector must
#           flag it (so it is redirected even if the LLM misses it).
#
# Metrics: precision and recall for each detector.

