name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src scripts tests && ruff format --check src scripts tests
      - name: Type check
        run: mypy src scripts
      - name: Test (coverage gate 90%)
        run: pytest --cov --cov-report=term-missing
      - name: Knowledge base builds
        run: python -m scripts.ingest_kb
      - name: Evaluation golden sets, offline (INN-02)
        run: python -m scripts.run_evals --gate --out /tmp/evals
      - name: OpenAPI schema is in sync with the frontend copy
        run: |
          python -m scripts.export_openapi /tmp/openapi.json
          diff -u ../frontend/openapi.json /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code src/api/generated
      - run: npm run lint
      - run: npm run typecheck
      - name: Test (coverage gate 90%)
        run: npm run test:coverage
      - run: npm run build
